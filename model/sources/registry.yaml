# Реестр источников карточек. / Registry of card sources.
# type: standard — стандарт или спецификация; practice — опубликованная практика; example — пример реализации.
# type: standard — standard or specification; practice — published practice; example — implementation example.
# checked: дата, когда мейнтейнер проверил ссылку и раздел (ГГГГ-ММ-ДД); пусто — не проверено.
