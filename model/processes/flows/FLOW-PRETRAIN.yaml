# Процесс на карте / Process on the map: FLOW-PRETRAIN
# workflow: узлы и переходы схемы; SVG схемы строит tools/build.py через Graphviz.
# workflow: diagram nodes and edges; tools/build.py renders the SVG with Graphviz.
name:
  ru: Обучение собственной базовой модели
  en: Foundation Model Pretraining
group: MOD
owner:
  - Владелец программы обучения; отдельные владельцы корпуса, ресурсов и оценки.
  - Training program owner with separate corpus, resource and evaluation owners.
start:
  - Обоснована потребность в новых базовых весах; определены семейство модели, целевые показатели и вычислительный бюджет.
  - New base weights are justified; model family, target metrics and compute budget are defined.
result:
  - Зарегистрированы базовые веса и материалы для проверяемого воспроизведения в согласованных допусках. Допуск к обслуживанию пользователей оформляется отдельно.
  - Base weights and evidence for reproduction within agreed tolerances are registered. Authorization for user serving is a separate decision.
check:
  - Прерывание тестового задания подтверждает согласованное возобновление. Зафиксированы версии корпуса, токенизатора, кода, запуска и результаты независимых испытаний.
  - An interruption test demonstrates consistent recovery. Corpus, tokenizer, code, run and independent evaluation results are pinned.
maturity:
  - Специализированная инженерия. Для крупной нагрузки нужны распределённое исполнение, сеть и проверенное восстановление.
  - Specialized engineering. Large workloads need distributed execution, fabric and tested recovery.
calls:
  - id: FLOW-DATA
    when:
      - Если обучающий корпус или его составные наборы ещё не допущены и не версионированы.
      - When the training corpus or any constituent dataset is not yet admitted and versioned.
order: 7
protection:
  - Каждый вызов модели проходит проверку идентичности и прав, защиту входа и выхода и аудит в разрешённом объёме. Вызовы инструментов допускаются отдельно; код исполняется в изолированной среде. Согласование и ограничения раскрытия задаются политикой.
  - Every model call uses identity and authorization checks, input and output protections, and permitted audit retention. Tool calls are authorized separately; code runs in a sandbox. Approval and disclosure restrictions follow policy.
parts:
  - TRAIN-DISTRIBUTED
  - CORE-01
  - FLOW-PRETRAIN--BRIEF
  - FLOW-PRETRAIN--CORPUS
  - FLOW-PRETRAIN--RECIPE
  - FLOW-PRETRAIN--READINESS
  - FLOW-PRETRAIN--TRAIN
  - FLOW-PRETRAIN--HEALTH
  - FLOW-PRETRAIN--REGISTER
  - FLOW-PRETRAIN--EVALUATE
tags: [Foundation Model Pretraining]
path: process-flow-pretrain
workflow:
  summary:
    - Обоснована потребность в новых базовых весах; определены семейство модели, целевые показатели и вычислительный бюджет. Зарегистрированы базовые веса и материалы для проверяемого воспроизведения в согласованных допусках. Допуск к обслуживанию пользователей оформляется отдельно.
    - New base weights are justified; model family, target metrics and compute budget are defined. Base weights and evidence for reproduction within agreed tolerances are registered. Authorization for user serving is a separate decision.
  synthesis:
    - Последовательность, условия переходов и сопоставление компонентов — проектный синтез AiNativeOps. Источники подтверждают отдельные практики в указанной области, а не всю схему.
    - The sequence, conditions and component mapping are AiNativeOps design synthesis. Sources support individual practices within their stated scope, not the entire diagram.
  basis:
    - source: P20-NEMO
      claim:
        - Предобучение и адаптация генеративных моделей, распределённые вычисления и контрольные точки.
        - Covers pretraining and adaptation of generative models, distributed computing, and checkpoints.
    - source: CUR
      claim:
        - Нормализация, фильтрация и дедупликация корпуса как инженерные операции подготовки.
        - Treats corpus normalization, filtering, and deduplication as engineering preparation operations.
    - source: TRAIN
      claim:
        - Шаблон среды обучения и спецификация задания существуют отдельно от выделения ресурсов.
        - The training runtime template and the job specification exist separately from resource allocation.
    - source: CKPT
      claim:
        - Сохраняет распределённые веса, состояния оптимизатора и метаданные для восстановления.
        - Saves distributed weights, optimizer states, and metadata for recovery.
    - source: NVI
      claim:
        - Согласованная инфраструктура для обучения и инференса. Отделяет вычислительное оборудование от программного управления нагрузками.
        - Describes a validated infrastructure for training and inference. Separates compute hardware from software workload management.
    - source: SSDF
      claim:
        - Безопасная разработка моделей и ИИ-систем, происхождение, проверки и роли.
        - Covers secure development of models and AI systems, provenance, checks, and roles.
  nodes:
    - id: brief
      label: ['Цель, базовый уровень и бюджет', 'Goal, baseline and budget']
      detail:
        - Согласовать модальности, целевые возможности, пороги безопасности, бюджет и условие остановки. Закрепить базовый уровень для сравнения и правила измерения до расчётов.
        - Agree on modalities, target capabilities, safety thresholds, budget and stop conditions. Pin the reference baseline and measurement rules before execution.
      kind: step
      components:
        architecture: [g0, m2, b_goal, b_np, b_polbudget]
        infrastructure: [experiment-tracking, eval-datasets, rate-limits-budgets]
        stack: [RM-DEV-05, RM-DAT-05, RM-OPS-06, RM-GOV-04]
    - id: corpus
      label: [Манифест корпуса и контрольных наборов, Corpus and evaluation set manifest]
      detail:
        - Связать источники, права, доли смеси, дедупликацию, классификацию и проверки на пересечение с контрольной выборкой. Если фильтр или генератор вызывают модель, каждый вызов проходит входные и выходные guardrails; модельные преобразования отмечаются в происхождении.
        - Bind sources, use rights, mixture weights, deduplication, classification and checks for overlap with evaluation data. If a filter or generator calls a model, every invocation passes input and output guardrails; record model-derived transforms in provenance.
      kind: step
      components:
        architecture: [d1, d2, d3, d5, g1, s_src, t_input, t_infer, t_result]
        infrastructure:
          - landing-zone
          - dataset-store
          - dataset-versioning
          - data-catalog
          - data-access-proxy
          - eval-datasets
          - input-guardrails
          - llm-gateway
          - output-guardrails
        stack:
          - RM-DAT-01
          - RM-DAT-02
          - RM-DAT-04
          - RM-DAT-05
          - RM-DPR-04
          - RM-TRS-05
          - RM-AIC-01
          - RM-MOD-06
          - RM-AIC-02
    - id: recipe
      label: [Рецепт предобучения и топология, Pretraining recipe and topology]
      detail:
        - 'Зафиксировать код архитектуры, версию токенизатора, инициализацию, функцию обучения и режим параллелизма. Определить контракт контрольной точки: веса, оптимизатор, шаг, порядок чтения и генераторы случайных чисел там, где это требуется.'
        - Pin architecture code, tokenizer, initialization, objective and parallelism. Define the checkpoint contract for weights, optimizer, step, data cursor and random states where needed.
      kind: step
      components:
        architecture: [m2, s_prep, g2, t_gpu]
        infrastructure:
          - git-repository
          - experiment-tracking
          - training-runtime
          - training-state
          - model-training-service
        stack: [RM-DEV-01, RM-DEV-04, RM-DEV-05, RM-DEV-11, RM-DEV-12, RM-PLT-02]
    - id: readiness
      label: ['Среда и восстановление проверены?', 'Are runtime and recovery verified?']
      detail:
        - На малом прогоне проверить обмен между участниками, пропускную способность хранения и доступа, метрики и пробное возобновление. Разрешить основной запуск только для закреплённой конфигурации.
        - Use a small run to verify communication, storage and access throughput, metrics and a trial restart. Admit the main run only for the pinned configuration.
      kind: decision
      components:
        architecture: [s_prep, g2, mt_ev, mt_tb]
        infrastructure: [training-runtime, training-state, dataset-store, metrics-alerts]
        stack: [RM-DEV-11, RM-DEV-12, RM-HW-02, RM-HW-04, RM-HW-05, RM-OPS-01]
    - id: train
      label: [Основной запуск и сохранение состояния, Main run and state persistence]
      detail:
        - Обучить новые веса из заданной инициализации, записывать телеметрию и согласованные контрольные точки. Тензорные вычисления остаются внутри задания; отдельный вызов модельного сервиса, включая промежуточную оценку, проходит входные и выходные guardrails.
        - Train new weights from the declared initialization while writing telemetry and consistent checkpoints. Tensor computation stays within the job; any separate model service call, including interim evaluation, passes input and output guardrails.
      kind: step
      components:
        architecture: [m3, t_gpu, b_polbudget, s_detect, t_input, t_infer, t_result]
        infrastructure:
          - training-runtime
          - training-state
          - experiment-tracking
          - metrics-alerts
          - input-guardrails
          - llm-gateway
          - output-guardrails
          - model-training-service
        stack:
          - RM-DEV-04
          - RM-DEV-11
          - RM-DEV-12
          - RM-DEV-05
          - RM-HW-02
          - RM-OPS-01
          - RM-OPS-06
          - RM-AIC-01
          - RM-MOD-06
          - RM-AIC-02
    - id: health
      label: ['Состояние запуска допустимо?', 'Is the run healthy and within limits?']
      detail:
        - Проверить ожидаемый шаг, численную устойчивость, ресурсы, качество контрольной выборки и ограничения данных. Различить достижение цели, временный сбой и недействительный запуск.
        - Check expected progress, numerical stability, resources, control metrics and data restrictions. Distinguish completion, transient failure and an invalid run.
      kind: decision
      components:
        architecture: [m4, s_detect, s_change, b_polbudget]
        infrastructure: [experiment-tracking, metrics-alerts, training-state, audit-log]
        stack: [RM-DEV-05, RM-OPS-01, RM-DEV-12, RM-OPS-06, RM-TRS-04]
    - id: resume
      label: ['Состояние совместимо для повтора?', 'Is the checkpoint compatible for restart?']
      detail:
        - Проверить целостность частей, версию рецепта, топологию и позицию чтения. Возобновить в пределах утверждённого числа повторов и бюджета; несовместимость не скрывать новым запуском под старым ID.
        - Check shard integrity, recipe version, topology and data cursor. Resume within approved retry and compute budgets; do not hide incompatibility by restarting under the same ID.
      kind: decision
      components:
        architecture: [s_change, mt_ev, t_gpu]
        infrastructure: [training-state, training-runtime, integrity-monitoring, experiment-tracking]
        stack: [RM-DEV-11, RM-DEV-12, RM-TRS-06, RM-DEV-05, RM-OPS-06]
    - id: register
      label: [Версия новых базовых весов, New base-weight version]
      detail:
        - Собрать веса, токенизатор, описание архитектуры, контрольные хеши и манифест обучения. Связать пакет со свидетелями происхождения и точным запуском; отметить ограничения предполагаемого использования.
        - Package weights, tokenizer, architecture description, digests and training manifest. Bind the package to provenance and the exact run; record intended-use limits.
      kind: step
      components:
        architecture: [m5, g3, t_base, o_pack]
        infrastructure: [eval-base-artifact, model-registry, artifact-registry, provenance-registry]
        stack: [RM-MOD-01, RM-MOD-05, RM-DEV-08, RM-TRS-05, RM-DEV-05]
    - id: evaluate
      label: ['Базовый кандидат пригоден?', 'Does the base candidate qualify?']
      detail:
        - Сопоставить независимые метрики с эталоном и бюджетом, проверить нежелательные поведения и ограничения. Кандидат и ИИ-контролёр запускаются через входные и выходные guardrails в испытательной среде; блокировки учитываются отдельно от качества модели.
        - Compare independent metrics with the reference and budget and test prohibited behavior and limitations. Candidate and AI controller calls use input and output guardrails in evaluation; count guardrail denials separately from model quality.
      kind: decision
      components:
        architecture: [m4, o_eval, g4, mt_indep, t_ctl, t_input, t_infer, t_result, t_eval]
        infrastructure:
          - eval-datasets
          - eval-red-teaming
          - llm-as-a-judge
          - rule-based-checks
          - eval-inference-runtime
          - input-guardrails
          - llm-gateway
          - output-guardrails
          - eval-inference-service
        stack: [RM-DAT-05, RM-DEV-07, RM-AIC-03, RM-MOD-11, RM-AIC-01, RM-MOD-06, RM-AIC-02]
    - id: review
      label: ['Возможна новая проверяемая итерация?', 'Is a new verifiable iteration possible?']
      detail:
        - Изолировать неверные данные, нестабильный рецепт или нарушение полномочий. Исправимый результат требует нового ID запуска и повторного допуска; изменение контрольного набора утверждает его владелец. При исчерпании бюджета остановить.
        - Isolate invalid data, unstable recipes or authority breaches. A fixable issue requires a new run ID and renewed admission; only the evaluation owner approves changes to controls. Stop when budget is exhausted.
      kind: decision
      components:
        architecture: [mt_review, b_owndata, s_change, b_polbudget, t_eval]
        infrastructure: [dataset-versioning, experiment-tracking, audit-log, eval-inference-service]
        stack: [RM-DAT-04, RM-DEV-05, RM-OPS-07, RM-TRS-04]
    - id: candidate
      label: [Проверенный базовый кандидат, Verified base candidate]
      detail:
        - Передать точный пакет весов, конфигурацию и отчёт оценивания владельцу модели. Результат можно исследовать или адаптировать в допущенной среде; регистрация не открывает рабочий маршрут.
        - Hand the exact weight package, configuration and evaluation report to the model owner. It may be researched or adapted in an approved environment; registration does not open a production route.
      kind: outcome
      components:
        architecture: [m5, mt_ev, b_ownmodel, t_audit]
        infrastructure: [model-registry, eval-base-artifact, provenance-registry, audit-log]
        stack: [RM-MOD-05, RM-MOD-01, RM-TRS-05, RM-TRS-04]
    - id: hold
      label: [Запуск или кандидат остановлен, Run or candidate stopped]
      detail:
        - Остановить использование затронутого корпуса и версии, если они не допущены. Сохранить доступные свидетельства, состояние и причину остановки в пределах политики хранения.
        - Stop use of the affected corpus or version if it is not authorized. Preserve available evidence, state and stop reason within retention policy.
      kind: outcome
      components:
        architecture: [s_resp, mt_residual, t_audit]
        infrastructure: [training-state, audit-log, provenance-registry]
        stack: [RM-DEV-12, RM-TRS-04, RM-TRS-05]
  edges:
    - from: brief
      to: corpus
      label: [Цель и эталон заданы, Goal and reference fixed]
    - from: corpus
      to: recipe
      label: [Состав и права корпуса закреплены, Corpus composition and rights pinned]
    - from: corpus
      to: hold
      label: [Источник запрещён или пересечение не устранено, Prohibited source or unresolved contamination]
    - from: recipe
      to: readiness
      label: [Конфигурация закреплена, Configuration pinned]
    - from: readiness
      to: train
      label: [Пробный запуск и восстановление прошли, Pilot and restart verified]
    - from: readiness
      to: review
      label: [Исправимая проблема среды, Fixable environment issue]
    - from: readiness
      to: hold
      label: [Допуск не получен, Admission denied]
    - from: train
      to: health
      label: [Достигнут рубеж или произошёл сбой, Milestone or failure reached]
    - from: health
      to: register
      label: [Задание завершено в пределах, Run completes within limits]
    - from: health
      to: resume
      label: [Технический сбой; возможен повтор, Transient failure; restart possible]
    - from: health
      to: review
      label: ['Данные, численные допуски или бюджет нарушены', 'Data, numerical or budget limit breached']
    - from: resume
      to: train
      label: [Состояние и бюджет подтверждены, State and budget verified]
    - from: resume
      to: review
      label: [Контрольная точка несовместима, Checkpoint incompatible]
    - from: resume
      to: hold
      label: [Повторы исчерпаны, Retry limit reached]
    - from: register
      to: evaluate
      label: [Кандидат зарегистрирован, Candidate registered]
    - from: evaluate
      to: candidate
      label: [Критерии базовой модели пройдены, Base criteria met]
    - from: evaluate
      to: review
      label: [Не пройдена независимая проверка, Independent check failed]
    - from: review
      to: corpus
      label: [Нужна новая версия данных, New data version required]
    - from: review
      to: recipe
      label: [Разрешён новый рецепт или среда, New recipe or runtime authorized]
    - from: review
      to: hold
      label: [Исправление недопустимо, Correction not authorized]
  main: [brief, corpus, recipe, readiness, train, health, register, evaluate, candidate]
