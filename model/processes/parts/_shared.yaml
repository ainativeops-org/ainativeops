IT-REPAIR:
  kind: subprocess
  name:
    ru: Исправление дефекта или сбоя CI
    en: Defect or CI repair
  description:
    - Исправление дефекта или сбоя CI. Повторно используемый маршрут внутри основного процесса.
    - Defect or CI repair. A reusable route within the main process.
  classes:
    - RM-APP-03
    - RM-AGT-01
    - RM-AGT-08
    - RM-GOV-02
    - RM-AGT-03
    - RM-AGT-07
    - RM-DPR-06
    - RM-AGT-02
    - RM-AGT-05
    - RM-ACT-03
    - RM-AIC-05
    - RM-MOD-12
    - RM-MOD-06
    - RM-AIC-01
    - RM-AGT-04
    - RM-ACT-02
    - RM-DEV-01
    - RM-ACT-04
    - RM-DEV-06
    - RM-SEC-04
    - RM-DEV-08
    - RM-DEV-07
    - RM-TRS-05
    - RM-DEV-09
    - RM-TRS-01
    - RM-DEV-10
    - RM-APP-01
    - RM-INT-01
    - RM-OPS-02
  alternative: false
  path: it-repair
  workflow:
    summary:
      - Исправить дефект или сбой CI с помощью агентов. Основной агент планирует работу, исполнители действуют в ограниченной среде, а проверки и ревью решают судьбу точной версии изменения. Исход — допущенное изменение либо эскалация.
      - Resolve a defect or CI failure with agents. The lead agent plans, executors work within a constrained environment, and checks and review determine whether the exact change version can proceed. The outcome is an admitted change or escalation.
    basis:
      - source: UBER-SOFTWARE-FACTORY
        claim:
          - Uber описывает агентные задачи исправления CI, подготовки PR и review с человеческими проверками; основная модель декомпозирует и оценивает, подагенты выполняют задачи.
          - Uber documents agent workflows for CI repair, PR preparation, and review with human checks; a lead model decomposes and evaluates while subagents execute.
    synthesis:
      - Эта последовательность, изолированная среда, критерии независимых проверок, лимит доработок и допуск точной версии — проект AiNativeOps. Две разные модели допустимы, но не обязательны; оценка основной моделью не заменяет CI и человеческое ревью.
      - This sequence, sandbox, independent check criteria, rework limit, and exact-version admission are an AiNativeOps design. Two distinct models are possible but not mandatory; lead-model evaluation does not replace CI and human review.
    nodes:
      - id: task
        label: [Задача и критерии исправления, Task and fix criteria]
        kind: step
        components:
          architecture: [v1, b_reqprod]
          infrastructure: [git-repository, business-apps]
          stack: [RM-DEV-01, RM-APP-01]
        detail:
          - Зафиксировать дефект или сбой, ожидаемое поведение, область изменения и критерии проверки.
          - Record the defect or failure, expected behavior, change scope, and acceptance checks.
      - id: admit
        label: [Полномочия и изолированная среда, Authority and sandbox]
        kind: decision
        components:
          architecture: [s_prep, b_polagent]
          infrastructure: [agent-iam, job-sandbox, pep, pdp]
          stack: [RM-GOV-02, RM-ACT-03, RM-ACT-02, RM-ACT-01]
        detail:
          - Разрешить ограниченную задачу, инструменты и ресурсы; выделить изолированное рабочее окружение. Недопустимые действия передать владельцу задачи.
          - Authorize a bounded task, tools, and resources; provision an isolated workspace. Escalate prohibited actions to the task owner.
      - id: context
        label: [Контекст репозитория и CI, Repository and CI context]
        kind: step
        components:
          architecture: [t_repo, t_ci]
          infrastructure: [git-repository, zero-trust-git, context-manager]
          stack: [RM-DEV-01, RM-ACT-04, RM-AGT-03]
        detail:
          - Получить разрешённый код, воспроизведение ошибки и результаты CI; защитить границы чтения и записи.
          - Obtain authorized code, failure reproduction, and CI results; enforce read and write boundaries.
      - id: plan
        label: [План и делегирование, Plan and delegate]
        kind: step
        components:
          architecture: [t_eng, t_harness]
          infrastructure: [agent-orchestrator, input-guardrails, llm-gateway, output-guardrails]
          stack: [RM-AGT-01, RM-AIC-01, RM-MOD-06, RM-AIC-02]
        detail:
          - Основной агент формирует проверяемый план и ограниченные задания исполнителям. Модельные вызовы проходят защитные проверки, а контекст полномочий сохраняется.
          - The lead agent forms a verifiable plan and bounded executor tasks. Model calls pass through safeguards and retain authority context.
      - id: execute
        label: [Изменение в изолированной среде, Change in the sandbox]
        kind: step
        components:
          architecture: [v2, t_eng, t_gw]
          infrastructure:
            - agent-runtime
            - job-sandbox
            - tool-router
            - pep
            - llm-gateway
            - input-guardrails
            - output-guardrails
          stack: [RM-AGT-02, RM-ACT-03, RM-AGT-04, RM-ACT-02, RM-MOD-06, RM-AIC-01, RM-AIC-02]
        detail:
          - Исполнитель меняет код только в допущенной области. Каждый инструмент проверяет право на конкретную операцию; модельный вызов остаётся защищённым независимо от уровня делегирования.
          - The executor edits only the authorized scope. Each tool call checks the exact operation; model invocations remain guarded at every delegation level.
      - id: checks
        label: ['Тесты и проверки пройдены?', 'Do tests and checks pass?']
        kind: decision
        components:
          architecture: [v3, s_scan, o_eval]
          infrastructure: [ci-runner, sast-sca-secrets, rule-based-checks]
          stack: [RM-DEV-06, RM-SEC-04, RM-DEV-07]
        detail:
          - Выполнить воспроизведение, тесты и проверки безопасности вне самооценки исполнителя. Сохранить свидетельства для точного изменения.
          - Run reproduction, tests, and security checks independently of executor self-assessment. Retain evidence for the exact change.
      - id: review
        label: [Ревью и допуск версии, Review and version admission]
        kind: decision
        components:
          architecture: [o_eval, o_release, b_ownrisk]
          infrastructure: [git-repository, eval-red-teaming, release-gate]
          stack: [RM-DEV-01, RM-DEV-07, RM-AIC-04, RM-DEV-09]
        detail:
          - Проверить PR и свидетельства, получить решение ответственного и допуск точной версии. Изменение кода после проверки требует повторных проверок.
          - Review the PR and evidence, obtain the responsible reviewer decision, and admit the exact version. Subsequent code changes require checks again.
      - id: rework
        label: ['Доработка в лимите?', 'Rework within limits?']
        kind: decision
        components:
          architecture: [s_change, b_polbudget]
          infrastructure: [agent-orchestrator, rate-limits-budgets, checkpoint-store]
          stack: [RM-AGT-01, RM-AGT-08, RM-AGT-05]
        detail:
          - Разрешить ограниченный цикл исправления по замечаниям. При исчерпании бюджета, расширении полномочий или неясной причине сбоя передать задачу человеку.
          - Allow a bounded correction loop using review feedback. Escalate on exhausted budget, required authority expansion, or an unclear failure cause.
      - id: release
        label: [Допущенное изменение, Admitted change]
        kind: outcome
        components:
          architecture: [o_release, o_ops]
          infrastructure: [git-repository, release-gate, cd-deployment, metrics-alerts]
          stack: [RM-DEV-01, RM-DEV-09, RM-DEV-10, RM-OPS-01]
        detail:
          - Сохранить согласованный PR и допуск версии. Развёртывание выполняется по принятой процедуре выпуска с наблюдением; наличие PR само по себе не разрешает выкладку.
          - Retain the approved PR and version admission. Deployment follows the approved release procedure with monitoring; a PR alone does not authorize deployment.
      - id: escalate
        label: [Эскалация владельцу, Escalate to the owner]
        kind: outcome
        components:
          architecture: [b_ownproc, t_audit]
          infrastructure: [business-apps, audit-log]
          stack: [RM-APP-01, RM-TRS-04]
        detail:
          - Передать состояние задачи, проверенные факты и причину остановки. Не выполнять недопущенные изменения ради завершения процесса.
          - Hand over task state, verified facts, and the stop reason. Do not make unauthorized changes just to finish.
    edges:
      - from: task
        to: admit
        label: [Критерии зафиксированы, Criteria recorded]
      - from: admit
        to: context
        label: [Задание допущено, Task admitted]
      - from: admit
        to: escalate
        label: [Недостаточно полномочий, Insufficient authority]
      - from: context
        to: plan
        label: [Контекст доступен, Context available]
      - from: context
        to: escalate
        label: [Нет необходимого контекста, Required context unavailable]
      - from: plan
        to: execute
        label: [Ограниченные задания, Bounded tasks]
      - from: execute
        to: checks
        label: [Изменение подготовлено, Change prepared]
      - from: execute
        to: escalate
        label: [Недопустимая операция, Prohibited operation]
      - from: checks
        to: review
        label: [Проверки пройдены, Checks passed]
      - from: checks
        to: rework
        label: [Проверки не пройдены, Checks failed]
      - from: review
        to: release
        label: [Версия одобрена, Version approved]
      - from: review
        to: rework
        label: [Требуются исправления, Corrections required]
      - from: review
        to: escalate
        label: [Выпуск не разрешён, Release not authorized]
      - from: rework
        to: plan
        label: [Лимит и полномочия сохранены, Budget and authority remain]
      - from: rework
        to: escalate
        label: [Лимит / расширение риска, Limit / increased risk]
