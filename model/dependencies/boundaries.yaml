  log-collectors:
    - Пайплайн телеметрии детализирован потоками между сбором и нормализацией. Это два экземпляра одного класса; связь между ними не размножается как зависимость класса от самого себя.
    - Telemetry flow distinguishes collection and normalization. These are instances of one class; their connection is not expanded into a class self-dependency.
  archive-backup:
    - 'Пока не специфицировано: конкретное физическое хранилище архива и домен отказа не выбраны в этой карте. Целевые RPO/RTO требуют проверки восстановления.'
    - 'Not yet specified: the physical archive store and failure domain are not selected in this map. Target RPO/RTO require recovery testing.'
  rule-based-checks:
    - Детерминированная часть стенда испытаний, отдельный экземпляр класса RM-DEV-07. Её обслуживание стенда показано связью модели; на уровне классов это не превращается в самозависимость.
    - A deterministic part of the evaluation bench, another RM-DEV-07 instance. Its serving relation to the bench is shown in the model; this does not become a class self-dependency.
  evidence-store:
    - Режим неизменяемости и сроки хранения подтверждаются конфигурацией и испытаниями; наличие архива само по себе их не доказывает.
    - Retention and immutability require configuration and testing; an archive alone does not establish them.
  analytical-store:
    - Хранилище данных может быть внешней корпоративной службой; физические носители и резервирование задаются профилем размещения.
    - The data store may be an existing enterprise service; physical storage and redundancy follow the placement profile.
