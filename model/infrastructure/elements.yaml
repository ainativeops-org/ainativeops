  class: RM-TRS-05
agent-orchestrator:
  type: appcomp
  class: RM-AGT-01
agent-runtime:
  type: appcomp
  class: RM-AGT-02
context-manager:
  type: appcomp
  class: RM-AGT-03
prompt-skill-registry:
  type: techsvc
  class: RM-AGT-07
tool-router:
  type: appcomp
  class: RM-AGT-04
agent-memory:
  type: techsvc
  class: RM-AGT-06
  category: data
notebooks:
  type: node
  class: RM-DEV-02
dataset-versioning:
  type: syssw
  class: RM-DAT-04
experiment-tracking:
  type: syssw
  class: RM-DEV-05
eval-red-teaming:
  type: node
  class: RM-DEV-07
  name:
    ru: Стенд eval и red teaming
    en: Eval and red teaming bench
  desc:
    ru: Выполняет независимые проверки конкретной версии кандидата на качество, безопасность и регрессию. Решение о выпуске принимает Release gate по совокупности свидетельств.
    en: Runs independent checks of a specific candidate version for quality, safety and regression. The release gate decides on release from the combined evidence.
eval-datasets:
  type: artifact
  class: RM-DAT-05
  category: data
llm-as-a-judge:
  type: techsvc
  class: RM-AIC-03
  category: llm
mcp-servers:
  type: appcomp
  class: RM-INT-02
inference-servers:
  type: techsvc
  class: RM-MOD-07
metrics-alerts:
  type: syssw
  class: RM-OPS-01
business-apps:
  type: appcomp
  class: RM-APP-01
landing-zone:
  type: techsvc
  class: RM-DAT-01
  name:
    ru: Карантинная зона
    en: Landing zone
  desc:
    ru: Изолированно хранит новые данные и обратную связь до допуска. Зафиксированы источник, цель обработки и срок хранения.
    en: Keeps new data and feedback isolated until admission. The source, processing purpose and retention period are recorded.
dataset-store:
  type: techsvc
  class: RM-DAT-04
  name:
    ru: Хранилище датасетов
    en: Dataset store
  desc:
    ru: Хранит содержимое допущенных версий обучающих и рабочих наборов. Версии и происхождение учитываются в версионировании датасетов.
    en: Holds the content of admitted versions of training and production datasets. Versions and provenance are tracked in dataset versioning.
vector-db:
  type: techsvc
  class: RM-DAT-07
data-catalog:
  type: syssw
  class: RM-DAT-02
git-repository:
  type: syssw
  class: RM-DEV-01
  name:
    ru: Git-репозиторий
    en: Git repository
  desc:
    ru: Хранит версии исходного кода, тестов и конфигурации. Обеспечивает ревью и правила изменения ветвей.
    en: Stores versions of source code, tests and configuration. Provides review and branch protection rules.
ci-runner:
  type: node
  class: RM-DEV-06
  name:
    ru: CI-раннер
    en: CI runner
  desc:
    ru: Создаёт временное окружение, собирает точную версию кандидата и запускает тесты. Фиксирует зависимости и результат; полномочия ограничены заданием.
    en: Creates a temporary environment, builds the exact candidate version and runs tests. Records dependencies and the result; authority is limited to the job.
artifact-registry:
  type: syssw
  class: RM-DEV-08
sast-sca-secrets:
  type: syssw
  class: RM-SEC-04
release-gate:
  type: techsvc
  class: RM-DEV-09
cd-deployment:
  type: techsvc
  class: RM-DEV-10
log-collectors:
  type: syssw
  class: RM-OPS-03
  name:
    ru: Агенты сбора логов
    en: Log collection agents
  desc:
    ru: Собирают журналы, метрики и трассы у источников и доставляют их с учётом буферизации и повторов. Секреты исключаются до отправки; полнота доставки контролируется.
    en: Collect logs, metrics and traces at the source and deliver them with buffering and retries. Secrets are removed before sending; delivery completeness is monitored.
event-normalization:
  type: syssw
  class: RM-OPS-03
  name:
    ru: Нормализация событий
    en: Event normalisation
  desc:
    ru: Разбирает, нормализует и обогащает события; маршрутизирует их потребителям. Формат выбирается по контракту получателя. Коллектор и процессор могут быть реализованы одним продуктом.
    en: Parses, normalises and enriches events and routes them to consumers. The format follows the recipient contract. Collector and processor can be one product.
log-metric-store:
  type: syssw
  class: RM-OPS-04
hsm-kms:
  type: techsvc
  class: RM-TRS-01
  name:
    ru: Управление ключами
    en: Key management
  desc:
    ru: Сервис управления жизненным циклом криптографических ключей и выполнения разрешённых криптографических операций. Аппаратная защита ключей и классы её реализации раскрыты на вкладке «Стек».
    en: Manages cryptographic key lifecycles and authorized cryptographic operations. Hardware-backed key protection and implementation classes are detailed in the Stack view.
pdp:
  type: techsvc
  class: RM-ACT-01
agent-iam:
  type: techsvc
  class: RM-GOV-02
audit-log:
  type: techsvc
  class: RM-TRS-04
integrity-monitoring:
  type: techsvc
  class: RM-TRS-06
checkpoint-store:
  type: techsvc
  class: RM-AGT-05
  category: llm
rate-limits-budgets:
  type: techsvc
  class: RM-AGT-08
  category: llm
rule-based-checks:
  type: techsvc
  class: RM-DEV-07
  name:
    ru: Rule-based проверки
    en: Rule-based checks
  desc:
    ru: Выполняет воспроизводимые проверки контрактов, свойств и пороговых значений. Фиксирует фактический результат и версию критерия для стенда eval.
    en: Runs reproducible checks of contracts, properties and thresholds. Records the actual result and the criterion version for the eval bench.
  category: node
llm-gateway:
  type: techsvc
  class: RM-MOD-06
  category: llm
archive-backup:
  type: syssw
  class: RM-OPS-08
  name:
    ru: Архив · Backup
    en: Archive · Backup
  desc:
    ru: Хранит файлы телеметрии и свидетельств длительного хранения. Режим неизменяемости, сроки удержания и процедура извлечения задаются политикой.
    en: Stores telemetry files and long-term evidence. Immutability mode, retention and retrieval procedure are set by policy.
token-vault:
  type: techsvc
  class: RM-TRS-02
  category: asc
secrets-manager:
  type: techsvc
  class: RM-TRS-03
  category: asc
kill-switch:
  type: techsvc
  class: RM-TRS-07
  category: asc
chat-app:
  type: appcomp
  class: RM-APP-02
  name:
    ru: Чат сотрудника
    en: Employee chat
  desc:
    ru: Проверяет право на разговор и собирает контекст из доступной истории. Передаёт запрос в обязательный входной контроль и возвращает только проверенный результат.
    en: Authorizes the conversation and assembles context from accessible history. Sends requests through mandatory input controls and returns only a checked result.
conversation-store:
  type: techsvc
  class: RM-PLT-03
  name:
    ru: Хранилище диалогов
    en: Conversation store
  desc:
    ru: Хранит разрешённые сообщения в области пользователя или проекта. Право на разговор проверяется при каждом чтении. Аудит ведётся отдельно.
    en: Stores admitted messages in the user or project scope. Authorizes each conversation read. Audit is separate.
training-runtime:
  type: techsvc
  class: RM-DEV-11
training-state:
  type: techsvc
  class: RM-DEV-12
inference-runtime:
  type: syssw
  class: RM-MOD-11
  category: llm
model-registry:
  type: appcomp
  class: RM-MOD-05
  category: llm
  name:
    ru: Реестр моделей
    en: Model registry
  desc:
    ru: Связывает допущенную версию с метаданными, происхождением и адресом артефакта. Используется при выборе и развёртывании версии; не предполагает обязательного сетевого запроса к реестру при каждом инференсе.
    en: Links an admitted version to metadata, provenance and an artifact location. Used during version selection and deployment; does not imply a registry network call for every inference request.
foundation-model-artifact:
  type: artifact
  class: RM-MOD-01
  category: llm
  name:
    ru: Артефакт базовой модели
    en: Base model artifact
  desc:
    ru: Зафиксированная версия базовых весов и конфигурации. Загружается для базовой модели или как совместимая основа LoRA. Полный дообученный checkpoint может заменить её при исполнении. Артефакт сам не выполняет вычисления.
    en: A pinned version of base weights and configuration. Loaded for a base model or as a compatible LoRA base. A full fine-tuned checkpoint can replace it at runtime. The artifact does not perform computation itself.
adapted-model-artifact:
  type: artifact
  class: RM-MOD-02
  category: llm
  name:
    ru: Артефакт адаптированной модели
    en: Adapted model artifact
  desc:
    ru: Допущенный полный checkpoint дообученной модели либо отдельный адаптер. В варианте LoRA требуется указанная совместимая базовая модель; полный checkpoint может исполняться самостоятельно. Включается только при выбранной адаптированной модели.
    en: An admitted full fine-tuned checkpoint or separate adapter. LoRA requires the specified compatible base model; a full checkpoint can execute on its own. Included only when an adapted model is selected.
multimodal-processing:
  type: techsvc
  class: RM-DAT-10
  category: data
evidence-store:
  type: techsvc
  class: RM-SEC-07
  category: node
analytical-store:
  type: techsvc
  class: RM-DAT-06
  category: data
semantic-layer:
  type: techsvc
  class: RM-DAT-03
  category: data
model-training-service:
  type: techsvc
  class: RM-DEV-04
  category: llm
eval-inference-service:
  type: techsvc
  class: RM-MOD-07
  category: llm
  name:
    ru: Инференс кандидата · EVAL
    en: Candidate inference · EVAL
  desc:
    ru: Отдельный экземпляр контура EVAL для проверки кандидата. Не является рабочим backend PROD. Доступ, версии и ресурсы задаются допуском испытания.
    en: A separate EVAL instance for candidate assessment, not the PROD backend. Test admission specifies access, versions and resources.
eval-inference-runtime:
  type: syssw
  class: RM-MOD-11
  category: llm
  name:
    ru: Среда инференса · EVAL
    en: Inference runtime · EVAL
  desc:
    ru: Отдельный экземпляр контура EVAL для проверки кандидата. Не является рабочим backend PROD. Доступ, версии и ресурсы задаются допуском испытания.
    en: A separate EVAL instance for candidate assessment, not the PROD backend. Test admission specifies access, versions and resources.
eval-base-artifact:
  type: artifact
  class: RM-MOD-01
  category: llm
  name:
    ru: Базовая модель-кандидат
    en: Base model candidate
  desc:
    ru: Отдельный экземпляр контура EVAL для проверки кандидата. Не является рабочим backend PROD. Доступ, версии и ресурсы задаются допуском испытания.
    en: A separate EVAL instance for candidate assessment, not the PROD backend. Test admission specifies access, versions and resources.
eval-adapted-artifact:
  type: artifact
  class: RM-MOD-02
  category: llm
  name:
    ru: Адаптированная модель-кандидат
    en: Adapted model candidate
  desc:
    ru: Отдельный экземпляр контура EVAL для проверки кандидата. Не является рабочим backend PROD. Доступ, версии и ресурсы задаются допуском испытания.
    en: A separate EVAL instance for candidate assessment, not the PROD backend. Test admission specifies access, versions and resources.
inference-quotas:
  type: techsvc
  class: RM-AIC-05
usage-billing:
  type: techsvc
  class: RM-OPS-06
request-classifier:
  type: techsvc
  class: RM-MOD-12
  category: llm
model-call-planner:
  type: techsvc
  class: RM-MOD-13
  category: llm
