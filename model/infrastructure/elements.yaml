# Элементы инфраструктуры. С class: и без name/desc элемент берёт текст класса.
# Infrastructure elements. With class: and no name/desc an element takes the class text.
model-hubs:
  type: node
  name:
    ru: Хабы моделей
    en: Model hubs
  desc:
    ru: Внешние источники весов и адаптеров. Артефакты проходят входной контроль до подключения к инженерным средам.
    en: External sources of weights and adapters. Artifacts pass intake control before they reach engineering environments.
external-datasets:
  type: node
  name:
    ru: Внешние датасеты
    en: External datasets
  desc:
    ru: Внешние наборы данных и источники знаний с фиксируемыми условиями использования.
    en: External datasets and knowledge sources with recorded terms of use.
external-llm-api:
  type: techsvc
  class: RM-MOD-03
  category: llm
public-package-registries:
  type: node
  name:
    ru: Публичные реестры пакетов
    en: Public package registries
  desc:
    ru: Внешние источники библиотек и образов. Зависимости проходят проверку и публикуются во внутреннем зеркале.
    en: External sources of libraries and images. Dependencies are checked and published to the internal mirror.
external-apis-mcp:
  type: appcomp
  name:
    ru: Внешние API и MCP
    en: External APIs and MCP
  desc:
    ru: Внешние системы, операции которых доступны через адаптеры инструментов. Каждый вызов требует отдельного допуска.
    en: External systems whose operations are reachable through tool adapters. Every call needs its own admission.
artifact-intake:
  type: techsvc
  class: RM-SEC-03
package-mirror:
  type: syssw
  class: RM-DEV-08
  name:
    ru: Зеркало пакетов
    en: Package mirror
  desc:
    ru: Публикует проверенные версии пакетов и образов для внутренних сборок. Загрузка новой версии проходит входной контроль.
    en: Publishes verified versions of packages and images for internal builds. A new version passes intake control before upload.
egress-proxy:
  type: techsvc
  class: RM-SEC-02
  name:
    ru: Egress-прокси
    en: Egress proxy
  desc:
    ru: Применяет сетевые правила выхода к внешним API. Разрешение соединения дополняет контроль конкретного модельного запроса или действия инструмента.
    en: Applies network egress rules to external APIs. Allowing a connection complements the control of a specific model request or tool action.
users:
  type: actor
  name:
    ru: Пользователи
    en: Users
  desc:
    ru: Сотрудники и подрядчики, которые работают с продуктом и платформой.
    en: Employees and contractors who work with the product and the platform.
erp-crm:
  type: appcomp
  name:
    ru: ERP / CRM
    en: ERP / CRM
  desc:
    ru: ERP, CRM, почта и платежи, где агент меняет внешнее состояние.
    en: ERP, CRM, mail and payments, where an agent changes external state.
iam-sso:
  type: syssw
  class: RM-SEC-01
siem-soc:
  type: syssw
  class: RM-SEC-05
