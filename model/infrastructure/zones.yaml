      - [agent-memory, agent-orchestrator, prompt-skill-registry, checkpoint-store]
  - id: exp
    title:
      ru: EXP · исследования и обучение
      en: EXP · research and training
    category: node
    rows:
      - [notebooks, dataset-versioning]
      - [gpu-training-cluster, experiment-tracking]
  - id: eval
    title:
      ru: EVAL · независимые испытания
      en: EVAL · independent testing
    category: node
    rows:
      - [eval-datasets, eval-red-teaming]
      - [rule-based-checks, llm-as-a-judge]
  - id: prod
    title:
