  - id: ci-cd
    title:
      ru: CI/CD
      en: CI/CD
    category: node
    rows:
      - [git-repository, ci-runner]
      - [sast-sca-secrets, artifact-registry]
      - [release-gate, cd-deployment]
  - id: observability
    title:
      ru: Observability
