# Зоны инфраструктуры и строки элементов в них. Набор зон задан раскладкой в site/app.js.
# Infrastructure zones and their element rows. The set of zones is fixed by the layout in site/app.js.
categories:
  ext:
    color: '#FFE0E0'
    label:
      ru: Внешние поставщики
      en: External providers
  perim:
    color: '#F5DEAA'
    label:
      ru: Периметр
      en: Perimeter
  asc:
    color: '#CCCCFF'
    label:
      ru: AI Safety Core
      en: AI Safety Core
  llm:
    color: '#B5FFFF'
    label:
      ru: Агенты и модели
      en: Agents and models
  data:
    color: '#FFFFB5'
    label:
      ru: Сервисы данных
      en: Data services
  node:
    color: '#C9E7B7'
    label:
      ru: Сервисы платформы
      en: Platform services
zones:
  - id: corp
    title:
      ru: Корпоративный контур
      en: Corporate perimeter
    category: node
    rows:
      - [users, erp-crm, iam-sso]
      - [siem-soc]
  - id: ai-safety-core
    title:
      ru: AI Safety Core
      en: AI Safety Core
    category: node
    accent: core
  - id: ext
    title:
      ru: Внешний контур
      en: External zone
    category: ext
    rows:
      - [model-hubs]
      - [external-datasets]
      - [external-llm-api]
      - [public-package-registries]
      - [external-apis-mcp]
  - id: dmz
    title:
      ru: Периметр
      en: Perimeter
    category: perim
    rows:
      - [artifact-intake]
      - [package-mirror]
      - [egress-proxy]
  - id: data-protection
    title:
      ru: Защита данных
      en: Data protection
    category: asc
    rows:
      - [data-discovery, tokenization]
      - [data-access-proxy, role-based-detokenization]
  - id: guardrails
    title:
      ru: Guardrails
      en: Guardrails
    category: asc
    rows:
      - [input-guardrails, output-guardrails]
      - [rag-access-filter, memory-guard]
  - id: operation-admission
    title:
      ru: Допуск операций
      en: Operation admission
    category: asc
    rows:
      - [job-sandbox, zero-trust-git]
      - [pep, provenance-registry]
