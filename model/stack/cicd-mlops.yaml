# CI/CD и MLOps / CI/CD and MLOps
# Ключ RM-… после версии 1.0 не меняется и не переиспользуется. / An RM-… key is frozen after 1.0 and never reused.
RM-DEV-01:
  name:
    ru: Репозиторий исходного кода
    en: Source code repository
  desc:
    ru: Хранит версии исходного кода, тестов и конфигурации. Обеспечивает ревью и правила изменения ветвей. При защищённом представлении кода доверенная среда раскрытия задаётся отдельно.
    en: Store versions of source code, tests and configuration. Provide review and branch protection rules. When code is stored in protected form, the trusted environment for disclosure is defined separately.
RM-DEV-02:
  name:
    ru: Интерактивная среда разработки
    en: Interactive development environment
  desc:
    ru: Интерактивная работа аналитиков и агентов с выборками. Данные поступают через Data Access Proxy в токенизированном виде.
    en: Interactive work of analysts and agents with samples. Data arrives through the Data Access Proxy in tokenised form.
  optional: true
RM-DEV-03:
  name:
    ru: Оркестратор конвейеров
    en: Pipeline orchestrator
  desc:
    ru: Оркестрирует версионированные конвейеры подготовки данных, экспериментов, оценки и выпуска. Управляет зависимостями заданий, повторными запусками и передачей артефактов; допуск действий и выпуска проверяется отдельными рубежами.
    en: Orchestrates versioned pipelines for data preparation, experiments, evaluation and release. Manages task dependencies, retries and artifact handoffs; separate gates enforce operation and release admission.
RM-DEV-04:
  name:
    ru: Сервис обучения моделей
    en: Model training service
  desc:
    ru: План эксперимента, запуск вычислений и формирование модели-кандидата. Преобразования защищаемых данных допускаются после проверки пригодности для задачи.
    en: Experiment plan, compute runs and building the model candidate. Transformations of protected data are allowed after a fitness check for the task.
RM-DEV-05:
  name:
    ru: Реестр запусков экспериментов
    en: Experiment run tracking
  desc:
    ru: Связывает запуск с кодом, параметрами и метриками. Артефакт модели передаётся на испытания и в реестр; регистрация запуска сама по себе допуска не даёт.
    en: Links a run to its code, parameters and metrics. The model artifact goes to testing and the registry; registering a run grants no admission by itself.
RM-DEV-06:
  name:
    ru: Среда сборки и проверки (CI)
    en: Build and verification environment (CI)
  desc:
    ru: Собирает кандидата в эфемерной среде, запускает тесты и сканирование. Фиксирует зависимости и хеш пакета; дальнейшая оценка относится к этой версии.
    en: Build the candidate in an ephemeral environment and run tests and scans. Record dependencies and the package hash; further evaluation refers to this version.
RM-DEV-07:
  name:
    ru: Сервис оценки и испытаний
    en: Evaluation and testing service
  desc:
    ru: Стенды качества, безопасности и регрессии для данных, моделей и агентов. Контрольные наборы и критерии защищены от изменения проверяемым исполнителем. Оценка LLM дополняет проверяемые критерии.
    en: Quality, safety and regression benches for data, models and agents. Control sets and criteria are protected from the executor under review. LLM evaluation complements verifiable criteria.
RM-DEV-08:
  name:
    ru: Реестр артефактов
    en: Artifact registry
  desc:
    ru: Пакеты, образы и дата-продукты с неизменяемыми версиями и происхождением. Реестр моделей имеет отдельный профиль метаданных.
    en: Packages, images and data products with immutable versions and provenance. The model registry has its own metadata profile.
RM-DEV-09:
  name:
    ru: Контроль допуска выпуска
    en: Release admission gate
  desc:
    ru: Проверяет обязательные свидетельства и манифест полной конфигурации. Разрешает выпуск точной версии и запрашивает подпись с использованием защищённого ключа.
    en: Checks mandatory evidence and the manifest of the full configuration. Allows release of the exact version and requests a signature with a protected key.
RM-DEV-10:
  name:
    ru: Развёртывание и откат
    en: Deployment and rollback
  desc:
    ru: Продвигает допущенную конфигурацию в PROD с проверкой подписи и поэтапным включением. Откат учитывает совместимость схем и совершённые внешние действия.
    en: Promotes the admitted configuration to PROD after a signature check, with staged rollout. Rollback considers schema compatibility and external actions already taken.
RM-DEV-11:
  name:
    ru: Среда распределённого обучения
    en: Distributed training runtime
  optional: true
  desc:
    ru: Согласует состав рабочих процессов, разбиение данных и модели, обмен и реакцию на отказ участника. Включается для распределённых заданий.
    en: Coordinates workers, model and data partitioning, communication, and worker failure for distributed jobs.
RM-DEV-12:
  name:
    ru: Хранилище состояния обучения
    en: Training checkpoint store
  optional: true
  desc:
    ru: Сохраняет согласованную версию весов, оптимизатора, шага и положения чтения данных для проверяемого возобновления обучения.
    en: Stores a consistent version of weights, optimizer state, training step, and data cursor for verifiable resumption.
