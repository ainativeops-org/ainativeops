# 02 · Платформа / 02 · Platform
# Ключ RM-… после версии 1.0 не меняется и не переиспользуется. / An RM-… key is frozen after 1.0 and never reused.
RM-PLT-01:
  name:
    ru: Среда системного исполнения
    en: System execution environment
  desc:
    ru: Предоставляет системное окружение для нагрузки с явно заданными версиями, интерфейсами и ресурсами. Для конкретного размещения указывает границу изоляции и применимые средства, включая ОС, контейнеры или виртуальные машины.
    en: Provides a system environment for workloads with specified versions, interfaces and resources. Each deployment defines its isolation boundary and applicable mechanisms, including operating systems, containers or virtual machines.
RM-PLT-02:
  name:
    ru: Планировщик вычислительных нагрузок
    en: Compute workload scheduler
  desc:
    ru: Размещает сервисы и задания с учётом доступных CPU, ускорителей, памяти, очередей и квот. Использует требования среды к размещению и ограничения изоляции. Выделение ускорителя и изоляция между владельцами проверяются по конфигурации платформы.
    en: Places services and jobs according to available CPU, accelerators, memory, queues and quotas. Applies environment placement and isolation constraints. Accelerator allocation and tenant isolation are verified against the platform configuration.
RM-PLT-03:
  name:
    ru: Транзакционные СУБД
    en: Transactional databases
  desc:
    ru: Хранят транзакционные данные приложений, метаданные и состояния сервисов. Выбор согласованности и отказоустойчивости определяется контрактом сервиса; области доступа разделяются по средам и проектам.
    en: Store transactional application data, metadata and service state. The service contract defines consistency and fault tolerance; access scopes are split by environment and project.
RM-PLT-04:
  name:
    ru: Брокер сообщений
    en: Message broker
  desc:
    ru: Брокеры заданий и событий с контролем доставки, повторов и изоляции потребителей. Внешние эффекты защищаются от повторного исполнения на уровне операции.
    en: Job and event brokers with delivery, retry and consumer isolation control. External effects are protected from repeated execution at the operation level.
RM-PLT-05:
  name:
    ru: Управление конфигурацией инфраструктуры
    en: Infrastructure configuration management
  desc:
    ru: Хранит версионированное желаемое состояние инфраструктуры и применяет утверждённые изменения. Сопоставляет фактическое состояние с заявленным. Инфраструктура как код и GitOps могут реализовать этот контур при соблюдении требований профиля.
    en: Stores versioned desired infrastructure state and applies approved changes. Compares observed and declared state. Infrastructure as code and GitOps can implement this control where they satisfy profile requirements.
