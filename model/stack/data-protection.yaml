# Безопасность данных / Data protection
# Ключ RM-… после версии 1.0 не меняется и не переиспользуется. / An RM-… key is frozen after 1.0 and never reused.
RM-DPR-01:
  name:
    ru: Обнаружение и классификация данных
    en: Data discovery and classification
  desc:
    ru: Определяет категории защищаемых значений и метки чувствительности. Подмена и проверка доступа используют его результат, качество классификации проверяют на контрольной выборке.
    en: Determines the categories of protected values and sensitivity labels. Tokenisation and access checks use the result; classification quality is checked on a control sample.
RM-DPR-02:
  name:
    ru: Токенизация значений
    en: Data value tokenisation
  desc:
    ru: Заменяет выбранные политикой значения токенами. Соответствия хранит словарь токенизации. Пригодность преобразованных данных для конкретного обучения или аналитики проверяется отдельно.
    en: Replaces values selected by policy with tokens. Mappings are kept in a protected token vault. Fitness of transformed data for a specific training or analytics task is checked separately.
RM-DPR-03:
  name:
    ru: Детокенизация по ролям
    en: Role-based detokenisation
  desc:
    ru: Возвращает разрешённое представление данных по роли, задаче и цели обработки. Обратная подмена обращается к словарю токенизации в разрешённой точке выдачи.
    en: Returns the permitted representation of data by role, task and processing purpose. Reverse substitution queries the token vault at an allowed disclosure point.
RM-DPR-04:
  name:
    ru: Шлюз доступа к данным
    en: Data access gateway
  desc:
    ru: Среды исследований, обучения и конвейеры читают выборки только через этот шлюз. Шлюз применяет решение PDP к каждому запросу.
    en: Research and training environments and pipelines read samples only through this gateway. The gateway applies the PDP decision to every request.
RM-DPR-05:
  name:
    ru: Шифрование данных
    en: Data encryption
  desc:
    ru: Шифрует данные при хранении, передаче и на уровне полей. Ключи хранятся в HSM и не попадают в среды агентов.
    en: Encrypts data at rest, in transit and at field level. Keys live in the HSM and never reach agent environments.
RM-DPR-06:
  name:
    ru: Контроль доступа к знаниям
    en: Retrieval access control
  desc:
    ru: Проверяет права и происхождение фрагментов RAG, файлов и графа знаний. Материалы задачи отбираются до сборки контекста; запрещённые сведения исключаются из результатов поиска. Каждый запрос к знаниям передаётся в учёт потребления.
    en: Checks rights and provenance of RAG fragments, files and knowledge graph entries. Task material is selected before context assembly; forbidden information is excluded from search results. Every knowledge query is reported to usage metering.
RM-DPR-07:
  name:
    ru: Контроль доступа к памяти агента
    en: Agent memory access control
  desc:
    ru: Контроль записи и извлечения долговременной памяти, разделение областей и карантин новых сведений. Источник и статус доверия сохраняются при сжатии или переносе между задачами.
    en: Controls writing to and reading from long-term memory, separates scopes and quarantines new information. Source and trust status survive compaction and transfer between tasks.
