# AI Governance / AI Governance
# Ключ RM-… после версии 1.0 не меняется и не переиспользуется. / An RM-… key is frozen after 1.0 and never reused.
RM-GOV-01:
  name:
    ru: Реестр ИИ-активов
    en: AI asset inventory
  desc:
    ru: Учитывает модели, агентов, инструменты и наборы данных с версиями, владельцами и статусами. Для конкретной конфигурации из записей можно сформировать ведомость состава ИИ-системы (AI/ML-BOM). В область анализа входят компоненты, которые создают, изменяют или оценивают систему.
    en: Tracks models, agents, tools and datasets with versions, owners and status. A version-specific AI/ML bill of materials can be exported from inventory records. Components that create, change or evaluate the system enter the assessment scope.
RM-GOV-02:
  name:
    ru: Идентичности агентов и сервисов
    en: Agent and workload identities
  desc:
    ru: Связывает агента и вызываемый инструмент с проверяемыми идентичностями нагрузок. Делегированные полномочия ограничиваются субъектом, ресурсом, операцией и сроком; отзыв применяется в точках исполнения. Корпоративную аутентификацию обеспечивает RM-SEC-01.
    en: Binds agents and tools to verifiable workload identities. Delegated authority is scoped to a subject, resource, action and expiry; revocation is enforced at the relevant enforcement points. RM-SEC-01 provides enterprise authentication.
RM-GOV-03:
  name:
    ru: Управление версиями политик
    en: Versioned policy management
  desc:
    ru: Поддерживает редактирование, тестирование, утверждение и публикацию версий политик раскрытия, полномочий и бюджетов. Проверяемая нагрузка не может менять действующую версию. Политику вычисляет точка принятия решений (PDP).
    en: Supports editing, testing, approval and publication of policies for disclosure, authority and budgets. Governed workloads cannot change the active version. The policy decision point (PDP) evaluates the published policy.
RM-GOV-04:
  name:
    ru: Реестр рисков и допусков
    en: Risk and admission register
  desc:
    ru: Связывает профиль системы, оценку рисков и решения на рубежах G0–G9 с версиями конфигурации и ссылками на свидетельства. Решение об остаточном риске и исключение имеют владельца, срок действия и условия пересмотра.
    en: Links the system profile, risk assessment and G0–G9 gate decisions to configuration versions and evidence references. Residual-risk acceptance and exceptions have an owner, an expiry and review conditions.
