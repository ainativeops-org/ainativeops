# 06 · Интеграция и инструменты / 06 · Integration and tools
# Ключ RM-… после версии 1.0 не меняется и не переиспользуется. / An RM-… key is frozen after 1.0 and never reused.
RM-INT-01:
  name:
    ru: Шлюз API
    en: API gateway
  desc:
    ru: Публикация API приложений, авторизация запросов и ограничение частоты обращений. Идентичность инициатора передаётся в Harness.
    en: Publishes application APIs, authorises requests and limits call rates. The initiator identity is passed to the Harness.
RM-INT-02:
  name:
    ru: Адаптеры инструментов
    en: Tool adapters
  desc:
    ru: Передают допущенную операцию конкретному инструменту через MCP, HTTP API или локальный интерфейс. Исполнитель или защищаемый ресурс проверяет применимый допуск к точной операции. Служебные секреты предоставляются исполнителю вне контекста модели.
    en: Send an admitted action to a specific tool using MCP, HTTP API or a local interface. The executor or protected resource checks the applicable grant for the exact action. Service secrets are supplied to the executor outside model context.
RM-INT-03:
  name:
    ru: Шлюз прикладных событий
    en: Application event gateway
  desc:
    ru: Принимает и публикует события по прикладным контрактам, проверяет схему, преобразует представление и выбирает получателей. Транспорт обеспечивает брокер сообщений, HTTP или иной механизм доставки.
    en: Receives and publishes events under application contracts, validates schemas, transforms representations and selects recipients. Delivery is provided by a message broker, HTTP or another transport.
RM-INT-04:
  name:
    ru: Шлюз межагентного взаимодействия
    en: Inter-agent gateway
  desc:
    ru: Передача задач между независимыми агентными системами с проверкой отправителя, области полномочий и состава контекста. Внутреннее делегирование может выполняться средствами Harness.
    en: Passes tasks between independent agent systems and checks the sender, the authority scope and the context content. Internal delegation can run inside the Harness.
  optional: true
