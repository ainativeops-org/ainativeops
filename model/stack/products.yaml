# 07 · Продукты / 07 · Products
# Ключ RM-… после версии 1.0 не меняется и не переиспользуется. / An RM-… key is frozen after 1.0 and never reused.
RM-APP-01:
  name:
    ru: Бизнес-приложения
    en: Business applications
  desc:
    ru: Прикладные продукты используют данные и модели для поиска, анализа и выполнения действий. Для каждого продукта задаются назначение, владелец и критерии результата.
    en: Applied products use data and models for search, analysis and actions. Each product has a purpose, an owner and result criteria.
RM-APP-02:
  name:
    ru: Пользовательские интерфейсы
    en: User interfaces
  desc:
    ru: Предоставляет интерфейс сотрудника или клиента. Перед чтением истории проверяет доступ к разговору. Запрос и разрешённый контекст проходят входную проверку; допущенный ответ можно выдать и сохранить.
    en: Provides the employee or customer interface. Authorizes access to a conversation before reading it. The request and allowed context pass input checks; only an admitted response can be delivered and saved.
RM-APP-03:
  name:
    ru: Консоль оператора
    en: Operator console
  desc:
    ru: Показывает оператору задачу, точную операцию и её параметры, ожидаемый эффект и сведения для проверки. Передаёт аутентифицированное решение механизму согласования RM-AIC-04.
    en: Presents the task, exact action and arguments, expected effect and review information. Sends the authenticated decision to the approval control in RM-AIC-04.
RM-APP-04:
  name:
    ru: Движок бизнес-процессов
    en: Business workflow engine
  desc:
    ru: Исполняет заданные бизнес-процессы, состояния и правила переходов. Вызывает агентные задачи там, где это предусмотрено сценарием; оркестратор агентов управляет внутренним делегированием.
    en: Executes defined business processes, states and transition rules. Calls agent tasks where the process provides for it; the agent orchestrator manages internal delegation.
  optional: true
