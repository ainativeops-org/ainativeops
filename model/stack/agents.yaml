# 05 · Агенты · Harness / 05 · Agents · Harness
# Ключ RM-… после версии 1.0 не меняется и не переиспользуется. / An RM-… key is frozen after 1.0 and never reused.
RM-AGT-01:
  name:
    ru: Оркестратор агентов
    en: Agent orchestrator
  desc:
    ru: 'Декомпозиция цели и назначение функциональных ролей: анализ, создание артефакта и проверка. Подзадачи наследуют ограничения исходной задачи; делегирование сохраняет ответственность инициатора.'
    en: 'Decomposes the goal and assigns functional roles: analysis, artifact creation and review. Subtasks inherit the constraints of the original task; delegation keeps the initiator accountable.'
RM-AGT-02:
  name:
    ru: Среда исполнения агентов
    en: Agent runtime
  desc:
    ru: Исполняет цикл агента, сохраняя состояние задачи. Вызывает модель через маршрут с входным и выходным контролем. Предложенные операции передаёт диспетчеру инструментов. Приостанавливает, возобновляет или завершает задачу по правилам.
    en: Runs the agent loop and maintains task state. Calls the model through a route with input and output controls. Sends proposed operations to the tool dispatcher. Suspends, resumes or terminates the task according to policy.
RM-AGT-03:
  name:
    ru: Управление контекстом
    en: Context management
  desc:
    ru: Собирает инструкции, разрешённые фрагменты знаний и результаты инструментов для текущего шага. Соблюдает лимиты контекста и сохраняет происхождение. Извлечённое содержимое и ответы инструментов сохраняют свою категорию доверия при включении в контекст.
    en: Assembles instructions, authorised knowledge fragments and tool results for the current step. Enforces context limits and preserves provenance. Retrieved content and tool responses retain their trust classification when included in context.
RM-AGT-04:
  name:
    ru: Диспетчер вызовов инструментов
    en: Tool dispatcher
  desc:
    ru: Проверяет схему предложения, находит инструмент по разрешённому идентификатору и передаёт точные аргументы в PEP. Направляет допущенный вызов адаптеру. Результат инструмента проходит проверку до возврата в контекст.
    en: Validates the proposed call schema, resolves the authorised tool identifier and submits exact arguments to the PEP. Dispatches the admitted call to the adapter. Tool results are checked before being returned to context.
RM-AGT-05:
  name:
    ru: Хранилище состояния задач
    en: Task state store
  desc:
    ru: Хранит состояние шагов, ожидаемые согласования и контрольные точки возобновления. Перед повтором внешнего действия сверяет его идентификатор и эффект с ресурсом; восстановление не восстанавливает отозванные полномочия.
    en: Stores step state, pending approvals and recovery checkpoints. Before retrying an external action, reconciles its identifier and effect with the resource; restoration does not reinstate revoked authority.
RM-AGT-06:
  name:
    ru: Долговременная память агентов
    en: Long-term agent memory
  desc:
    ru: Хранит сведения для повторного использования между задачами. Области доступа, происхождение и сроки хранения задаются отдельно от состояния текущего исполнения.
    en: Stores information for reuse across tasks. Access scopes, provenance and retention are set separately from the state of the current run.
RM-AGT-07:
  name:
    ru: Реестр инструкций и навыков
    en: Instruction and skill registry
  desc:
    ru: Версии системных инструкций, skills и схем инструментов связаны с манифестом. Изменения проходят ревью и регрессионные проверки; права изменения политик выделены отдельно.
    en: Versions of system instructions, skills and tool schemas are linked to the manifest. Changes go through review and regression checks; the right to change policies is separate.
RM-AGT-08:
  name:
    ru: Лимиты и бюджеты задач
    en: Task limits and budgets
  desc:
    ru: Учитывает время, стоимость и число шагов всей задачи, включая делегирование. Резервирует лимит до платной операции; при исчерпании останавливает выполнение или запрашивает решение.
    en: Accounts for time, cost and number of steps of the whole task, including delegation. Reserves the limit before a paid operation; when exhausted it stops execution or asks for a decision.
