# Технологии / Technology
t_eng:
  type: node
  name:
    ru: ИИ-инженер · LLM-агент
    en: AI engineer · LLM agent
  desc:
    ru: Исполнитель в ограниченной среде Harness. Использует модель и допущенные инструменты, формирует кандидаты и не утверждает свой выпуск.
    en: An executor in a constrained Harness. Uses an admitted model and tools, produces candidates, and cannot approve its own release.
t_ctl:
  type: llm
  name:
    ru: ИИ-контролёр · модельная оценка
    en: AI controller · model-based evaluation
  desc:
    ru: Внутренняя модель формирует дополнительные оценки для испытаний и контроля исполнения. Окончательное решение о допуске принимает защищённый механизм правил.
    en: An internal model produces supplementary assessments for testing and runtime control. A protected rule mechanism takes the final admission decision.
  class: RM-AIC-03
t_base:
  type: llm
  name:
    ru: Базовая модель
    en: Base model
  desc:
    ru: Предобученная модель поставщика. Её принимают с проверкой происхождения и формата весов.
    en: A provider's pretrained model. It is accepted after provenance and weight format checks.
  class: RM-MOD-01
t_target:
  type: llm
  name:
    ru: Адаптированная модель и адаптеры
    en: Adapted model and adapters
  desc:
    ru: Модель, которую выпускает MLOps и использует целевая система.
    en: The model that MLOps releases and the target system uses.
  class: RM-MOD-02
t_ext:
  type: llm
  name:
    ru: Внешний сервис инференса
    en: External inference service
  desc:
    ru: ИИ поставщика за пределами контура. Его недоступные для проверки процессы записывают как ограничение и основание остаточного риска.
    en: A provider's AI outside the perimeter. Its processes that cannot be verified are recorded as a constraint and as grounds for residual risk.
  class: RM-MOD-03
t_store:
  type: node
  name:
    ru: Карантинная зона и датасеты
    en: Landing zone and datasets
  desc:
    ru: Хранит исходные и подготовленные данные. Новые записи проходят карантин до допуска.
    en: Stores source and prepared data. New records stay in quarantine until admitted.
  class: RM-DAT-01
t_vec:
  type: node
  name:
    ru: Сервис извлечения знаний
    en: Knowledge retrieval service
  desc:
    ru: Индексирует допущенные знания, ищет релевантные фрагменты и возвращает их с источниками. Поддерживает полнотекстовый, векторный или гибридный поиск по потребности. RAG использует этот сервис при подготовке контекста.
    en: Indexes admitted knowledge, finds relevant fragments and returns them with sources. Supports full-text, vector or hybrid search as needed. RAG uses this service to prepare context.
  class: RM-DAT-07
t_mem:
  type: node
  name:
    ru: Долговременная память агентов
    en: Long-term agent memory
  desc:
    ru: Хранит сведения для повторного использования между задачами. Области доступа, происхождение и сроки хранения задаются отдельно от состояния текущего исполнения.
    en: Stores information for reuse across tasks. Access scopes, provenance and retention are set separately from the state of the current run.
  class: RM-AGT-06
t_repo:
  type: node
  name:
    ru: Git-репозиторий
    en: Git repository
  desc:
    ru: Код, тесты и конфигурация сборки. Служит источником контекста для ИИ-инженера.
    en: Code, tests and build configuration. It is a context source for the AI engineer.
  class: RM-DEV-01
t_gpu:
  type: node
  name:
    ru: GPU-кластер обучения
    en: GPU training cluster
  desc:
    ru: Выделяет ресурсы для допущенного задания. Распределённый запуск и контрольные точки задаются отдельными контрактами.
    en: Provides resources for the admitted job. Distributed execution and checkpoints have separate contracts.
  class: RM-HW-02
t_ci:
  type: node
  name:
    ru: CI/CD
    en: CI/CD
  desc:
    ru: Сборка и тесты. Агент не имеет права менять правила допуска в конвейере.
    en: Build and tests. The agent has no right to change admission rules in the pipeline.
  class: RM-DEV-06
t_reg:
  type: node
  name:
    ru: Реестр артефактов
    en: Artifact registry
  desc:
    ru: Хранит версии моделей и пакетов, связанные с манифестом выпуска.
    en: Stores model and package versions linked to the release manifest.
  class: RM-DEV-08
t_prod:
  type: node
  name:
    ru: PROD-среда
    en: PROD environment
  desc:
    ru: Среда исполнения целевой системы.
    en: The runtime environment of the target system.
t_gw:
  type: node
  name:
    ru: Диспетчер инструментов и PEP
    en: Tool dispatcher and PEP
  desc:
    ru: Исполняет авторизацию, политику раскрытия и бюджеты вне модели. У агента нет канала к инструментам в обход этой точки.
    en: Enforces authorisation, the disclosure policy and budgets outside the model. The agent has no channel to tools that bypasses this point.
  class: RM-ACT-02
t_iam:
  type: node
  name:
    ru: IAM / SSO
    en: IAM / SSO
  desc:
    ru: Идентичности людей, агентов и сервисов, аутентификация и ограниченные машинные полномочия. Выдача служебных секретов имеет отдельный интерфейс и политику.
    en: Identities of people, agents and services, authentication and limited machine authority. Service secrets are issued through a separate interface and policy.
  class: RM-SEC-01
t_siem:
  type: node
  name:
    ru: SIEM / SOC
    en: SIEM / SOC
  desc:
    ru: Коррелирует события безопасности и формирует инциденты. Использует нормализованные события и доступ к истории; управление реагированием задаётся регламентом.
    en: Correlates security events and raises incidents. Uses normalised events and history access; response handling follows the procedure.
  class: RM-SEC-05
t_chat:
  type: appcomp
  class: RM-APP-02
  name:
    ru: Чат сотрудника
    en: Employee chat
  desc:
    ru: Проверяет право на разговор и собирает контекст из доступной истории. Передаёт запрос в обязательный входной контроль и возвращает только проверенный результат.
    en: Authorizes the conversation and assembles context from accessible history. Sends requests through mandatory input controls and returns only a checked result.
t_history:
  type: techsvc
  class: RM-PLT-03
  name:
    ru: Хранилище диалогов
    en: Conversation store
  desc:
    ru: Хранит разрешённые сообщения в области пользователя или проекта. Право на разговор проверяется при каждом чтении. Аудит ведётся отдельно.
    en: Stores admitted messages in the user or project scope. Authorizes each conversation read. Audit is separate.
t_input:
  type: techsvc
  class: RM-AIC-01
  name:
    ru: Контроль запроса
    en: Input controls
  desc:
    ru: Проверяет запрос и контекст по политике до вызова модели.
    en: Checks the request and context against policy before invocation.
t_route:
  type: techsvc
  class: RM-MOD-12
  name:
    ru: Классификатор запросов
    en: Request classifier
  desc:
    ru: Оценивает сложность запроса и выдаёт профиль маршрута в пределах политики раскрытия.
    en: Estimates request complexity and issues a route profile within the disclosure policy.
t_plan:
  type: techsvc
  class: RM-MOD-13
  name:
    ru: Планировщик вызовов моделей
    en: Model call planner
  desc:
    ru: Разбивает составной запрос на подзадачи для разных моделей и собирает ответ.
    en: Splits a composite request into subtasks for different models and assembles the answer.
t_infer:
  type: techsvc
  class: RM-MOD-06
  name:
    ru: Шлюз инференса
    en: Inference gateway
  desc:
    ru: Выбирает допущенный маршрут и версию модели. Перед внешней передачей применяет политику раскрытия.
    en: Selects the admitted route and model version. Applies disclosure policy before external transfer.
t_result:
  type: techsvc
  class: RM-AIC-02
  name:
    ru: Контроль результата
    en: Output controls
  desc:
    ru: Проверяет результат до передачи получателю, контексту или инструменту.
    en: Checks the result before delivery to a recipient, context, or tool.
t_audit:
  type: techsvc
  class: RM-TRS-04
  name:
    ru: Аудит решений
    en: Decision audit
  desc:
    ru: Связывает решение с инициатором, запросом, маршрутом и версией политики. Хранение переписки имеет отдельный контракт.
    en: Binds decisions to the initiator, request, route, and policy version. Conversation history has a separate contract.
t_harness:
  type: techsvc
  class: RM-AGT-02
  name:
    ru: Harness агента
    en: Agent Harness
  desc:
    ru: Ведёт запуск, контекст, предложения инструментальных действий и восстановление. Решение о действии применяет независимая точка контроля.
    en: Manages the run, context, tool proposals, and resumption. An independent enforcement point applies action decisions.
t_eval:
  type: techsvc
  class: RM-MOD-07
  name:
    ru: Испытание кандидата · EVAL
    en: Candidate testing · EVAL
  desc:
    ru: Изолированное исполнение модели-кандидата для оценки. Рабочее размещение разрешается отдельным решением выпуска.
    en: Isolated execution of the model candidate for evaluation. Productive placement requires a separate release decision.
