name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate model
        run: python tools/validate.py
      - name: Build map
        run: python tools/build.py
        env:
          AINO_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: map-preview
          path: dist/index.html

  layout:
    runs-on: ubuntu-latest
    needs: model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/build.py
      - name: Check rendering in both languages
        run: python tools/check_layout.py
